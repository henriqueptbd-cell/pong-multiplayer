<!DOCTYPE html>
<html lang="pt-BR">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pong Multiplayer</title>
     <link rel="stylesheet" href="css/style.css">
     <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
     <style>
          /* Estilos para o menu */
          #menu {
               position: fixed;
               top: 0;
               left: 0;
               width: 100%;
               height: 100%;
               display: flex;
               justify-content: center;
               align-items: center;
               background: rgba(10, 10, 26, 0.95);
               z-index: 1000;
               flex-direction: column;
               font-family: 'Courier New', monospace;
          }

          #menu.hidden {
               display: none;
          }

          #menu h1 {
               color: #33ff33;
               font-size: 48px;
               margin-bottom: 20px;
               text-shadow: 0 0 20px rgba(51, 255, 51, 0.5);
          }

          #menu input {
               padding: 12px 20px;
               font-size: 18px;
               background: #1a1a2e;
               color: #33ff33;
               border: 2px solid #33ff33;
               border-radius: 5px;
               margin: 10px 0;
               width: 300px;
               font-family: 'Courier New', monospace;
               text-align: center;
          }

          #menu input:focus {
               outline: none;
               box-shadow: 0 0 20px rgba(51, 255, 51, 0.3);
          }

          #menu button {
               padding: 12px 30px;
               font-size: 18px;
               background: #33ff33;
               color: #0a0a1a;
               border: none;
               border-radius: 5px;
               cursor: pointer;
               font-family: 'Courier New', monospace;
               font-weight: bold;
               margin: 5px;
               transition: all 0.3s;
          }

          #menu button:hover {
               transform: scale(1.05);
               box-shadow: 0 0 30px rgba(51, 255, 51, 0.5);
          }

          #menu button.secondary {
               background: transparent;
               color: #33ff33;
               border: 2px solid #33ff33;
          }

          #menu .error {
               color: #ff6b6b;
               margin: 10px 0;
               font-size: 14px;
          }

          #menu .success {
               color: #51cf66;
               margin: 10px 0;
               font-size: 14px;
          }

          #menu .info {
               color: #ffd700;
               margin: 10px 0;
               font-size: 16px;
          }

          .menu-buttons {
               display: flex;
               gap: 10px;
               margin-top: 10px;
               flex-wrap: wrap;
               justify-content: center;
          }

          .room-code {
               background: #1a1a2e;
               padding: 20px 40px;
               border: 3px solid #ffd700;
               border-radius: 10px;
               font-size: 32px;
               color: #ffd700;
               letter-spacing: 5px;
               margin: 10px 0;
               font-family: 'Courier New', monospace;
          }

          #gameContainer {
               display: none;
          }

          #gameContainer.active {
               display: block;
          }
     </style>
</head>

<body>

     <!-- ==========================================
    MENU PRINCIPAL
    ========================================== -->
     <div id="menu">
          <h1>🎮 PONG</h1>

          <!-- Tela Inicial -->
          <div id="menuMain">
               <input type="text" id="playerName" placeholder="Digite seu nome" maxlength="20">
               <div class="menu-buttons">
                    <button id="btnCreateRoom">🏠 Criar Sala</button>
                    <button id="btnJoinRoom" class="secondary">🔑 Entrar em Sala</button>
               </div>
               <div id="menuError" class="error"></div>
          </div>

          <!-- Tela Criar Sala -->
          <div id="menuCreate" style="display: none;">
               <p class="info">✅ Sala criada! Compartilhe o código:</p>
               <div class="room-code" id="roomCode">ABC123</div>
               <p class="info">Aguardando oponente...</p>
               <button id="btnCancelRoom" class="secondary">Cancelar</button>
               <div id="createError" class="error"></div>
          </div>

          <!-- Tela Entrar em Sala -->
          <div id="menuJoin" style="display: none;">
               <input type="text" id="joinCode" placeholder="Digite o código da sala" maxlength="6"
                    style="text-transform: uppercase;">
               <div class="menu-buttons">
                    <button id="btnConfirmJoin">🔑 Entrar</button>
                    <button id="btnCancelJoin" class="secondary">Voltar</button>
               </div>
               <div id="joinError" class="error"></div>
          </div>
     </div>

     <!-- ==========================================
    JOGO
    ========================================== -->
     <div id="gameContainer">
          <canvas id="gameCanvas" width="800" height="500"></canvas>
     </div>

     <!-- ==========================================
    SOCKET.IO
    ========================================== -->
     <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
     <script>
          if (typeof io === 'undefined') {
               document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.min.js"><\/script>');
          }
     </script>

     <script type="module">
          import Game from './js/core/game.js';
          import SocketClient from './js/network/socket.js';

          // ==========================================
          // INICIALIZAR
          // ==========================================
          const game = new Game('gameCanvas');
          const socket = new SocketClient();

          window.game = game;
          window.socket = socket;

          // ==========================================
          // DOM ELEMENTOS
          // ==========================================
          const menu = document.getElementById('menu');
          const menuMain = document.getElementById('menuMain');
          const menuCreate = document.getElementById('menuCreate');
          const menuJoin = document.getElementById('menuJoin');
          const gameContainer = document.getElementById('gameContainer');

          const playerNameInput = document.getElementById('playerName');
          const joinCodeInput = document.getElementById('joinCode');
          const roomCodeDisplay = document.getElementById('roomCode');

          const btnCreateRoom = document.getElementById('btnCreateRoom');
          const btnJoinRoom = document.getElementById('btnJoinRoom');
          const btnConfirmJoin = document.getElementById('btnConfirmJoin');
          const btnCancelRoom = document.getElementById('btnCancelRoom');
          const btnCancelJoin = document.getElementById('btnCancelJoin');

          const menuError = document.getElementById('menuError');
          const joinError = document.getElementById('joinError');
          const createError = document.getElementById('createError');

          let currentRoom = null;
          let playerName = '';

          // ==========================================
          // FUNÇÕES DE UI
          // ==========================================
          function showMainMenu() {
               menuMain.style.display = 'block';
               menuCreate.style.display = 'none';
               menuJoin.style.display = 'none';
               menuError.textContent = '';
               joinError.textContent = '';
               createError.textContent = '';
          }

          function showCreateRoom(code) {
               menuMain.style.display = 'none';
               menuCreate.style.display = 'block';
               menuJoin.style.display = 'none';
               roomCodeDisplay.textContent = code;
          }

          function showJoinRoom() {
               menuMain.style.display = 'none';
               menuCreate.style.display = 'none';
               menuJoin.style.display = 'block';
               joinCodeInput.value = '';
               joinError.textContent = '';
          }

          // ==========================================
          // startGame (CORRIGIDO)
          // ==========================================
          function startGame() {
               menu.classList.add('hidden');
               gameContainer.classList.add('active');

               // ✅ Conecta o game ao socket e sala atual
               game.setSocket(socket, currentRoom);

               console.log('🎮 Jogo iniciado na sala', currentRoom);
          }

          // ==========================================
          // EVENTOS DO MENU
          // ==========================================

          // Criar Sala
          btnCreateRoom.addEventListener('click', async () => {
               const name = playerNameInput.value.trim() || 'Jogador';
               playerName = name;

               try {
                    const response = await socket.createRoom(name);
                    currentRoom = response.code;
                    showCreateRoom(response.code);
                    console.log(`🏠 Sala criada: ${response.code}`);
               } catch (error) {
                    menuError.textContent = `❌ ${error}`;
               }
          });

          // Entrar em Sala (mostrar tela)
          btnJoinRoom.addEventListener('click', () => {
               const name = playerNameInput.value.trim() || 'Jogador';
               playerName = name;
               showJoinRoom();
          });

          // Confirmar Entrar em Sala
          btnConfirmJoin.addEventListener('click', async () => {
               const code = joinCodeInput.value.trim().toUpperCase();
               if (!code || code.length !== 6) {
                    joinError.textContent = '❌ Digite um código válido (6 caracteres)';
                    return;
               }

               try {
                    const response = await socket.joinRoom(code, playerName);
                    currentRoom = code;
                    console.log(`🔑 Entrou na sala: ${code}`);
                    startGame();
               } catch (error) {
                    joinError.textContent = `❌ ${error}`;
               }
          });

          // Cancelar criar sala
          btnCancelRoom.addEventListener('click', () => {
               showMainMenu();
          });

          // Cancelar entrar em sala
          btnCancelJoin.addEventListener('click', () => {
               showMainMenu();
          });

          // Enter para confirmar
          joinCodeInput.addEventListener('keydown', (e) => {
               if (e.key === 'Enter') btnConfirmJoin.click();
          });

          playerNameInput.addEventListener('keydown', (e) => {
               if (e.key === 'Enter') btnCreateRoom.click();
          });

          // ==========================================
          // EVENTOS SOCKET.IO
          // ==========================================

          // --- QUANDO RECEBE ESTADO DO JOGO ---
          socket.socket.on('gameState', (state) => {
               game.updateFromServer(state);
          });

          // --- QUANDO JOGO COMEÇA ---
          socket.socket.on('gameStarting', (data) => {
               console.log('🎮 Jogo começando!', data);

               // Inicia o jogo no servidor
               socket.socket.emit('gameStart', {
                    roomCode: currentRoom
               });

               // Inicia a contagem regressiva
               socket.socket.emit('startCountdown', {
                    roomCode: currentRoom
               });

               startGame();
          });

          // --- QUANDO JOGADOR ENTRA ---
          socket.socket.on('playerJoined', (data) => {
               console.log('👋 Jogador entrou:', data);
               if (data.players.length === 2) {
                    createError.textContent = '✅ Oponente entrou! Jogo começando...';
                    setTimeout(() => {
                         startGame();
                    }, 1000);
               }
          });

          // ==========================================
          // ENVIAR TECLAS PARA O SERVIDOR
          // ==========================================
          setInterval(() => {
               if (!currentRoom || !socket.isConnected) return;
               if (game.state !== 'PLAYING') return;

               const keys = {
                    up: game.keys['w'] || game.keys['W'] || game.keys['ArrowUp'],
                    down: game.keys['s'] || game.keys['S'] || game.keys['ArrowDown']
               };

               socket.socket.emit('keys', {
                    roomCode: currentRoom,
                    playerId: socket.socket.id,
                    keys: keys
               });
          }, 50);

          // ==========================================
          // EVENTOS DE PAUSA E CONTAGEM
          // ==========================================

          // --- Pausa via servidor ---
          socket.socket.on('pauseState', (data) => {
               game.pauseFromServer(data.state);
               console.log(`🔄 Pausa: ${data.state}`);
          });

          // --- Contagem regressiva ---
          socket.socket.on('countdownUpdate', (data) => {
               const timer = data.timer;
               if (timer > 0) {
                    console.log(`⏳ ${timer}...`);
               } else {
                    console.log('🎮 Jogo começou!');
               }
          });

          // --- Reconexão ---
          socket.socket.on('reconnectSuccess', (data) => {
               console.log('🔄 Reconectado à sala!', data);
               currentRoom = data.room.code;
               startGame();
          });

          socket.socket.on('reconnectError', (data) => {
               console.error('❌ Erro ao reconectar:', data.error);
               alert(`Erro ao reconectar: ${data.error}`);
               showMainMenu();
          });

          // --- Jogador saiu ---
          socket.socket.on('playerLeft', (data) => {
               console.log('👋 Jogador saiu:', data);
               if (data.players.length === 0) {
                    alert('O outro jogador saiu. Fim de jogo.');
                    showMainMenu();
               }
          });

          // ==========================================
          // INICIAR
          // ==========================================
          showMainMenu();
          console.log('🚀 Pong Multiplayer - Sistema de Salas');
          console.log('🔧 Crie uma sala ou entre com um código');
     </script>
</body>

</html>
