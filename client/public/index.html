<!DOCTYPE html>
<html lang="pt-BR">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Pong Multiplayer - Aprendendo Redes</title>
     <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <canvas id="gameCanvas" width="800" height="500"></canvas>

     <!-- ==========================================
         SOCKET.IO CLIENT (CDN)
         ========================================== -->
     <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

     <script type="module">
          // ==========================================
          // IMPORTAÇÕES
          // ==========================================
          import Game from './js/core/game.js';
          import SocketClient from './js/network/socket.js';

          // ==========================================
          // INICIALIZAR JOGO
          // ==========================================
          const game = new Game('gameCanvas');
          window.game = game; // Debug

          // ==========================================
          // INICIALIZAR SOCKET
          // ==========================================
          const socket = new SocketClient();
          window.socket = socket; // Debug

          // ==========================================
          // ESCUTAR EVENTOS DO SOCKET
          // ==========================================

          // Quando receber um 'pong' do servidor
          document.addEventListener('serverPong', (event) => {
               console.log('🏓 Evento PONG recebido:', event.detail);
               // Aqui podemos integrar com o jogo no futuro
          });

          // Quando receber uma mensagem do servidor
          document.addEventListener('serverMessage', (event) => {
               console.log('💬 Mensagem do servidor:', event.detail);
          });

          // ==========================================
          // TESTE MANUAL (via console)
          // ==========================================
          console.log('🚀 Pong Multiplayer com Socket.IO!');
          console.log('🎮 Pressione P para começar o jogo');
          console.log('🔧 Objetos disponíveis:');
          console.log('   - game: Controle o jogo');
          console.log('   - socket: Envie mensagens para o servidor');
          console.log('   - Ex: socket.sendPing({ hello: "world" })');
          console.log('   - Ex: socket.sendMessage("Olá servidor!")');
     </script>
</body>

</html>
